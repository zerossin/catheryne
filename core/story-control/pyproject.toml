[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "story-control"
version = "0.1.0"
description = "Lightweight supervision and evidence-based progress for agent-assisted story play"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Story Control contributors"}]
dependencies = []

[project.optional-dependencies]
hud = ["Pillow==12.3.0", "numpy==2.3.5"]

[project.scripts]
story-control = "story_control.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
story_control = ["dashboard.html", "dashboard.js"]
